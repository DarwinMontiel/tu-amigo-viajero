name: Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, pruebas unitarias y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint (TypeScript, React y accesibilidad)
        run: npm run lint

      - name: Tipos (tsc -b en los tres paquetes)
        run: npm run typecheck

      - name: Pruebas unitarias (dominio, proveedores, API e IA)
        run: npm test

      - name: Build de la web
        run: npm run build

      - name: Empaquetar el Worker sin desplegar
        working-directory: apps/api
        run: npx wrangler deploy --dry-run --outdir ../../node_modules/.tmp/worker

  e2e:
    name: E2E y accesibilidad (1440 y 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas e2e con axe-core (modo demo)
        run: npm run e2e

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
