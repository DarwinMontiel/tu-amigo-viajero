<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t">
  <title id="t">Ilustración: el río de cinco colores de Caño Cristales, en la Serranía de La Macarena</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3d9"/>
      <stop offset="1" stop-color="#bfe8f2"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd3e0"/>
      <stop offset="1" stop-color="#2a8fb0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#cielo)"/>
  <circle cx="760" cy="90" r="45" fill="#fff6c9"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="200" cy="90" rx="80" ry="22"/><ellipse cx="250" cy="75" rx="50" ry="24"/>
    <ellipse cx="560" cy="130" rx="70" ry="18"/>
  </g>
  <!-- serranía -->
  <path d="M0 260 L120 180 L230 230 L360 150 L500 220 L640 160 L780 230 L900 190 V320 H0 Z" fill="#6b8f4e"/>
  <path d="M0 300 L150 240 L300 280 L470 220 L620 270 L780 240 L900 260 V340 H0 Z" fill="#4f7a3a"/>
  <!-- selva -->
  <g fill="#2f5d2b">
    <circle cx="40" cy="330" r="40"/><circle cx="110" cy="320" r="45"/><circle cx="180" cy="335" r="38"/>
    <circle cx="720" cy="325" r="42"/><circle cx="800" cy="315" r="48"/><circle cx="870" cy="330" r="40"/>
  </g>
  <!-- roca -->
  <rect y="340" width="900" height="260" fill="#c8a978"/>
  <!-- río -->
  <path d="M330 340 C 300 420, 420 460, 360 600 L 620 600 C 560 470, 520 420, 560 340 Z" fill="url(#agua)"/>
  <!-- macarenia: plantas acuáticas rojas, amarillas y verdes -->
  <g>
    <path d="M370 380 q20 -18 40 0 q20 -18 40 0 q20 -18 40 0 q20 -18 40 0" stroke="#d7263d" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M360 440 q22 -20 44 0 q22 -20 44 0 q22 -20 44 0 q22 -20 44 0" stroke="#e8443a" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M380 505 q24 -20 48 0 q24 -20 48 0 q24 -20 48 0 q24 -20 48 0" stroke="#f2b134" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M370 565 q26 -22 52 0 q26 -22 52 0 q26 -22 52 0 q26 -22 52 0" stroke="#4caf50" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M480 410 q15 -12 30 0" stroke="#9b2d7a" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  <!-- piedras -->
  <g fill="#a6875a">
    <ellipse cx="120" cy="450" rx="80" ry="30"/><ellipse cx="230" cy="520" rx="60" ry="24"/>
    <ellipse cx="740" cy="470" rx="90" ry="32"/><ellipse cx="680" cy="555" rx="60" ry="22"/>
  </g>
  <g fill="#8a6d44">
    <ellipse cx="120" cy="460" rx="60" ry="14"/><ellipse cx="740" cy="482" rx="64" ry="14"/>
  </g>
</svg>
