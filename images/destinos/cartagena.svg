<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t">
  <title id="t">Ilustración: murallas y Torre del Reloj de Cartagena al atardecer</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d6e"/>
      <stop offset=".45" stop-color="#e2557a"/>
      <stop offset=".8" stop-color="#ffb35c"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a5d"/>
      <stop offset="1" stop-color="#3a3f8f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#cielo)"/>
  <circle cx="690" cy="330" r="70" fill="#ffd27a" opacity=".9"/>
  <g fill="#ffffff" opacity=".35">
    <ellipse cx="180" cy="120" rx="90" ry="14"/>
    <ellipse cx="560" cy="90" rx="120" ry="12"/>
  </g>
  <rect y="400" width="900" height="200" fill="url(#mar)"/>
  <g stroke="#ffd27a" stroke-width="4" opacity=".55">
    <line x1="630" y1="420" x2="750" y2="420"/>
    <line x1="650" y1="445" x2="730" y2="445"/>
    <line x1="670" y1="470" x2="710" y2="470"/>
  </g>
  <!-- casas coloniales -->
  <g>
    <rect x="40" y="250" width="110" height="120" fill="#f4c542"/>
    <rect x="150" y="270" width="90" height="100" fill="#e86a5c"/>
    <rect x="240" y="240" width="80" height="130" fill="#5bc0be"/>
    <rect x="470" y="260" width="100" height="110" fill="#f29e4c"/>
    <rect x="570" y="280" width="90" height="90" fill="#c9a0dc"/>
    <g fill="#3b2a4a" opacity=".55">
      <rect x="60" y="280" width="18" height="30"/><rect x="100" y="280" width="18" height="30"/>
      <rect x="168" y="295" width="16" height="28"/><rect x="205" y="295" width="16" height="28"/>
      <rect x="258" y="265" width="16" height="28"/><rect x="288" y="265" width="16" height="28"/>
      <rect x="490" y="285" width="18" height="30"/><rect x="530" y="285" width="18" height="30"/>
      <rect x="590" y="300" width="16" height="26"/><rect x="625" y="300" width="16" height="26"/>
    </g>
    <g fill="#2f6b3a"><circle cx="40" cy="255" r="18"/><circle cx="660" cy="285" r="16"/></g>
  </g>
  <!-- Torre del Reloj -->
  <g>
    <rect x="335" y="170" width="120" height="200" fill="#f6e7c8"/>
    <rect x="355" y="110" width="80" height="70" fill="#f6e7c8"/>
    <path d="M350 112 L395 60 L440 112 Z" fill="#d9534f"/>
    <circle cx="395" cy="145" r="22" fill="#fff" stroke="#3b2a4a" stroke-width="4"/>
    <path d="M395 145 L395 130 M395 145 L406 150" stroke="#3b2a4a" stroke-width="4" stroke-linecap="round"/>
    <path d="M365 370 L365 270 Q395 230 425 270 L425 370 Z" fill="#3b2a4a" opacity=".7"/>
  </g>
  <!-- muralla -->
  <path d="M0 360 H900 V410 H0 Z" fill="#c9a26b"/>
  <g fill="#c9a26b">
    <rect x="0" y="345" width="30" height="20"/><rect x="60" y="345" width="30" height="20"/>
    <rect x="120" y="345" width="30" height="20"/><rect x="180" y="345" width="30" height="20"/>
    <rect x="240" y="345" width="30" height="20"/><rect x="300" y="345" width="30" height="20"/>
    <rect x="460" y="345" width="30" height="20"/><rect x="520" y="345" width="30" height="20"/>
    <rect x="580" y="345" width="30" height="20"/><rect x="640" y="345" width="30" height="20"/>
    <rect x="700" y="345" width="30" height="20"/><rect x="760" y="345" width="30" height="20"/>
    <rect x="820" y="345" width="30" height="20"/><rect x="880" y="345" width="30" height="20"/>
  </g>
  <path d="M0 395 H900" stroke="#a9824f" stroke-width="5"/>
  <!-- velero -->
  <g transform="translate(190 470)">
    <path d="M0 30 H90 L75 48 H15 Z" fill="#2b2d6e"/>
    <path d="M45 28 V-40 L85 25 Z" fill="#fff"/>
    <path d="M42 28 V-25 L10 25 Z" fill="#ffe3c2"/>
  </g>
</svg>
